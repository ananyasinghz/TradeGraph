regulatory_chunks:
  - id: chunk_roo_6109
    source_document_id: src_safta_roo_illustrative
    hs_code: "6109.10"
    tags: [rules_of_origin, fta, certificate]
    text: >
      Illustrative rules of origin for knitted cotton T-shirts (HS 6109.10):
      preferential duty may be claimed where the good is wholly obtained in a
      beneficiary country or undergoes a change in tariff classification with
      qualifying regional value content. A valid certificate of origin must
      accompany the claim. This text is prototype-only and not legal advice.
  - id: chunk_roo_general
    source_document_id: src_safta_roo_illustrative
    hs_code: null
    tags: [rules_of_origin, proof_of_origin]
    text: >
      Illustrative proof of origin guidance: importers should retain the
      commercial invoice, packing list, and certificate of origin matching the
      preferential claim. Preferential rates do not apply if origin requirements
      fail verification. Prototype excerpt only.
  - id: chunk_rate_change_note
    source_document_id: src_in_cbic_illustrative_2026
    hs_code: "6109.10"
    tags: [tariff_update, notification]
    text: >
      Illustrative notification: basic customs duty for HS 6109.10 on the
      BD→IN corridor is shown as 10% effective 2026-01-01, superseding the
      prior illustrative 12% schedule. Not an official gazette extract.
